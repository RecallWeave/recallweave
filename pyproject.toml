[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recallweave"
version = "0.1.0"
description = "A local-first, evidence-cited discovery and resurfacing engine for Obsidian vaults."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RecallWeave contributors" }]
keywords = ["obsidian", "knowledge-graph", "personal-knowledge-management", "local-first", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
test = ["mistletoe>=1.6"]

[project.urls]
Homepage = "https://github.com/RecallWeave/recallweave"
Issues = "https://github.com/RecallWeave/recallweave/issues"
Security = "https://github.com/RecallWeave/recallweave/security"

[project.scripts]
recallweave = "recallweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
