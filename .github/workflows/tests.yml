name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      RECALLWEAVE_TEST_EXTRA_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -v

  viewer:
    # The "production server delivers every rendered client asset" test is
    # about Windows asset serving, so run it where that platform is exercised,
    # not only on Linux.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm audit --package-lock-only
      - run: npm audit --package-lock-only --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Branch protection requires the check context named exactly `viewer`.
  # A matrix job publishes `viewer (ubuntu-latest)` / `viewer (windows-latest)`
  # instead, which would leave the required status pending forever. This
  # single-name gate collapses the matrix result into that required context.
  viewer-required:
    name: viewer
    needs: viewer
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all viewer matrix legs
        run: |
          if [ "${{ needs.viewer.result }}" != "success" ]; then
            echo "viewer matrix result: ${{ needs.viewer.result }}"
            exit 1
          fi
